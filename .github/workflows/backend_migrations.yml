name: Backend migrations

on:
  pull_request:
    paths:
      - "backend/migrations/**"
      - "backend/cmd/migration-check/**"
      - "backend/scripts/check-schema-drift.sh"
      - "backend/Makefile"
      - ".github/workflows/backend_migrations.yml"
  push:
    paths:
      - "backend/migrations/**"
      - "backend/cmd/migration-check/**"
      - "backend/scripts/check-schema-drift.sh"
      - "backend/Makefile"
      - ".github/workflows/backend_migrations.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgrespw@localhost:5432/cftracker_migration_test?sslmode=disable
      REFERENCE_DATABASE_URL: postgres://postgres:postgrespw@localhost:5432/cftracker_migration_reference?sslmode=disable

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Reject changed historical migrations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi

          if ! git cat-file -e "$BASE_SHA:.github/workflows/backend_migrations.yml" 2>/dev/null; then
            echo "Establishing the initial immutable migration baseline"
            exit 0
          fi

          changed="$(git diff --name-status "$BASE_SHA" "$GITHUB_SHA" -- backend/migrations)"
          invalid="$(printf '%s\n' "$changed" | awk 'NF > 0 && $1 != "A"')"
          if [ -n "$invalid" ]; then
            echo "Applied migration files are immutable. Add a new migration instead:"
            printf '%s\n' "$invalid"
            exit 1
          fi

      - name: Create test databases
        run: |
          createdb -h localhost -U postgres cftracker_migration_test
          createdb -h localhost -U postgres cftracker_migration_reference
        env:
          PGPASSWORD: postgrespw

      - name: Verify migration workflow
        working-directory: backend
        run: |
          make migrate-up
          make migrate-check
          make migrate-down
          make migrate-up
          make migrate-check
          make migrate-check-schema reference_database_url="$REFERENCE_DATABASE_URL"
