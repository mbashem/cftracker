name: Refresh Codeforces snapshots

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-codeforces-snapshots
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh snapshots
        working-directory: scripts
        run: |
          node fetch_contests.mts
          node fetch_problems.mts

      - name: Check for modified files
        id: git-check
        run: |
          if git diff --quiet -- src/data/saved_api/contests_data.ts src/data/saved_api/problems_data.ts; then
            echo "modified=false" >> "$GITHUB_OUTPUT"
          else
            echo "modified=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install validation dependencies
        if: steps.git-check.outputs.modified == 'true'
        run: npm ci

      - name: Commit verified snapshots
        if: steps.git-check.outputs.modified == 'true'
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/saved_api/contests_data.ts src/data/saved_api/problems_data.ts
          git commit -m "chore(data): update Codeforces snapshots"

      - name: Push verified snapshots
        if: steps.git-check.outputs.modified == 'true'
        run: git push origin "HEAD:${GITHUB_REF_NAME}"
